<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <fieldset>
        <legend>sexo</legend>
        <input type="radio" name="sexo" id="isxmax" value="M">
        <label for="isxmax">Masculino</label>
        <input type="radio" name="sexo" id="isxfem" value="F">
        <label for="isxfem">Feminino</label>
    </fieldset>
    <fieldset>
        <legend>Esporetes favoritos</legend>
        <input type="checkbox" name="basq" id="ibasq"> Basquete
        <input type="checkbox" name="fut" id="ifut"> Futebol
        <input type="checkbox" name="bei" id="ibei"> Beisibol
    </fieldset>

    <p>
        <input type="submit" value="enviar">
        <input type="reset" value="limpar">
    </p>
</body>
</html>
